<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viktor</title>
<style>
  :root {
    --bg: #f4efe6; --ink: #2b2620; --muted: #8a7f70; --card: #fffaf2;
    --accent: #c2703d; --you: #4f6f63; --line: #e4dccd;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1916; --ink: #efe7da; --muted: #9c917f; --card: #24211d;
            --accent: #e08a52; --you: #86a99b; --line: #34302a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 17px/1.5 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    display: grid; grid-template-rows: 1fr auto; min-height: 100dvh;
  }
  main {
    display: grid; grid-template-rows: auto 1fr; gap: 24px;
    width: min(560px, 100%); margin: 0 auto; padding: 40px 16px 16px;
  }
  #stage { display: grid; justify-items: center; gap: 14px; --level: 0; --you: 0; }
  .portrait {
    position: relative; width: 168px; height: 168px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #e9c9a6, #b98457 70%, #8e5f3a);
    display: grid; place-items: center;
    color: #fff8ee; font-size: 64px; letter-spacing: 1px;
    box-shadow: 0 10px 30px rgb(0 0 0 / .12);
  }
  .portrait img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .ring {
    position: absolute; inset: -10px; border-radius: 50%;
    border: 3px solid var(--accent); opacity: 0;
    transform: scale(calc(1 + var(--level) * .12));
    transition: transform 80ms linear, opacity 200ms;
  }
  #stage[data-state="speaking"] .ring { opacity: .9; }
  #stage[data-state="user"] .ring {
    opacity: .7; border-color: var(--you);
    transform: scale(calc(1 + var(--you) * .1));
  }
  #stage[data-state="connecting"] .ring { opacity: .5; animation: breathe 1.4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.08); opacity: .15; } }
  h1 { margin: 6px 0 0; font-weight: 500; font-size: 28px; }
  #status { color: var(--muted); font-size: 15px; font-family: system-ui, sans-serif; min-height: 1.5em; }
  #until { color: var(--muted); font-size: 13px; font-family: system-ui, sans-serif; }
  .synthetic { color: var(--muted); font-size: 12px; font-family: system-ui, sans-serif; text-align: center; margin: 0 0 8px; }
  #log {
    overflow-y: auto; padding: 4px 2px; display: flex; flex-direction: column; gap: 10px;
    min-height: 120px; max-height: calc(100dvh - 400px);
  }
  #log:empty::before {
    content: "Drück auf den Hörer, um Viktor anzurufen.";
    color: var(--muted); text-align: center; margin-top: 24px; font-style: italic;
  }
  #log p { margin: 0; max-width: 85%; padding: 10px 14px; border-radius: 16px; }
  #log .viktor { background: var(--card); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }
  #log .you { background: var(--you); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; font-family: system-ui, sans-serif; font-size: 15px; }
  footer { display: grid; justify-items: center; padding: 8px 16px 32px; }
  #call {
    width: 72px; height: 72px; border-radius: 50%; border: 0; cursor: pointer;
    background: #3f8f5b; color: #fff; display: grid; place-items: center;
    box-shadow: 0 6px 18px rgb(0 0 0 / .18); transition: background .2s, transform .1s;
  }
  #call:active { transform: scale(.96); }
  #call:disabled { opacity: .6; cursor: wait; }
  #call[data-active="1"] { background: #c0412f; }
  #call[data-active="1"] svg { transform: rotate(135deg); }
  #call svg { width: 30px; height: 30px; transition: transform .2s; }
</style>
</head>
<body>
<main>
  <section id="stage" data-state="idle">
    <div class="portrait"><div class="ring"></div><span id="initial">V</span></div>
    <h1>Viktor</h1>
    <div id="status">Bereit</div>
    <div id="until"></div>
  </section>
  <section id="log" aria-live="polite"></section>
</main>
<footer>
  <p class="synthetic">KI-Stimme, aus Viktors Sprachnachrichten nachgebildet. Keine echte Aufnahme.</p>
  <button id="call" aria-label="Anrufen">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
  </button>
</footer>

# Site Settings
title: Andrii Shylenko
locale: "en-US"
description: "Technical founder building tools for firmware, industrial systems, and agent-assisted engineering."
url: "https://shylenko.com"
baseurl: "" # subpath of your site, e.g. /blog
repository: "w1ne/w1ne.github.io"

# Theme Settings
remote_theme: "mmistakes/minimal-mistakes"
# theme: "minimal-mistakes-jekyll"
minimal_mistakes_skin: "dark" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"
search: true

# Author / Personal Info
author:
  name: "Andrii Shylenko"
  avatar: "/images/profile-photo.jpg"
  bio: "Technical founder building engineering tools"
  email: "andrii@shylenko.com"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/w1ne"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/shylenko"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter"
      url: "https://twitter.com/andriishylenko"

# Navigation
logo: "/images/logoAS_blue_white.png"
date_format: "%Y-%m-%d"

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap

# Exclude non-Jekyll sources from the build. The repo carries a parallel Astro
# app (src/, astro.config.mjs) plus tooling; Jekyll must not try to render them
# (src/components/SiteFooter.astro broke the legacy Pages build). The first block
# preserves Jekyll's built-in defaults so node_modules/vendor are not processed.
exclude:
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - src
  - scripts
  - docs
  - TODO
  - ciFirmware.bin
  - astro.config.mjs
  - tsconfig.json
  - package.json
  - package-lock.json

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      classes: wide
      read_time: true
      comments: true
      share: true
      related: true
  # pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      classes: wide

# Sass
sass:
  style: compressed

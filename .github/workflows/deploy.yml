name: Deploy site (Astro — manual only)

# DISABLED auto-run 2026-06-14. This Astro build is incomplete (npm run build
# fails on type errors) and, if it ever succeeded, actions/deploy-pages would
# REPLACE the live Jekyll site (and delete project folders like /flowstun/).
# The live publisher is the legacy Jekyll Pages build. Trigger this manually
# only once the Astro migration is actually finished.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Copy CNAME
        run: cp CNAME dist/CNAME
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

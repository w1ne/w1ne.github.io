name: Site build check

# Builds the site the same way GitHub Pages does on every push. If it can't
# build, this run goes RED and opens a GitHub issue — so a broken deploy is
# never silent again (the live site keeps serving the last good build, which is
# exactly why the mid-2026 breakage went unnoticed for weeks).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  jekyll-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Jekyll (mirrors GitHub Pages)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Open an issue if the build failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.slice(0, 7);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = '🚨 shylenko.com build is FAILING — new changes are NOT going live';
            const body = [
              `The Jekyll build broke on commit \`${sha}\`.`,
              '',
              'The live site keeps serving the **last good build**, so there is no visible',
              'symptom — but anything you push now will NOT appear until this is fixed.',
              '',
              `Failed run: ${run}`,
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'deploy-failure',
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['deploy-failure'],
              });
            }
